name: Register or firmware support
description: A register is wrong or missing, or a firmware version is not supported
labels: [registers]
body:
  - type: input
    id: firmware
    attributes:
      label: Genesis firmware version
      placeholder: 17.1.11
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Heat pump model
    validations:
      required: true
  - type: textarea
    id: registers
    attributes:
      label: Affected registers
      description: Register space, address, and what the documentation says versus what the pump reports.
    validations:
      required: true
  - type: textarea
    id: dump
    attributes:
      label: Register dump
      description: Output of `thermia-genesis dump`.
      render: json
