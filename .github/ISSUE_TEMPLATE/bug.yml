name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Heat pump model
      placeholder: Calibra 7
    validations:
      required: true
  - type: input
    id: firmware
    attributes:
      label: Genesis firmware version
      description: Shown on the display, or read from input registers 311–313.
      placeholder: 17.1.11
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: thermia-genesis version
    validations:
      required: true
  - type: textarea
    id: dump
    attributes:
      label: Register dump or logs
      description: Output of `thermia-genesis dump`, a traceback, or debug logs.
      render: text
